<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#1d1822">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Eggcentric">
		<meta name="mobile-web-app-capable" content="yes">
		<link rel="manifest" href="manifest.webmanifest">
		<title>Eggcentric web demo</title>
		<style>
@font-face {
	font-family: "Luckiest Guy";
	src: url("/fonts/LuckiestGuy-Regular.ttf") format("truetype");
	font-display: swap;
}
@font-face {
	font-family: "Baloo 2";
	src: url("/fonts/Baloo2-VF.ttf") format("truetype");
	font-weight: 400 800;
	font-display: swap;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	position: fixed;
	inset: 0;
	color: #fff8e8;
	background-color: #000;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: "Baloo 2", system-ui, sans-serif;
}
#back {
	position: absolute;
	top: max(14px, env(safe-area-inset-top));
	left: max(16px, env(safe-area-inset-left));
	display: none;
	color: #cec8b2;
	font-weight: 700;
	font-size: 15px;
	text-decoration: none;
}
#back:hover, #back:focus-visible {
	color: #fff8e8;
}
#rotate {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 20px;
	padding: 32px;
	text-align: center;
	background: #1d1822;
}
#rotate p {
	margin: 0;
	max-width: 280px;
	font-size: 20px;
	font-weight: 700;
	line-height: 1.3;
}
#rotate a {
	color: #cec8b2;
	font-size: 15px;
	font-weight: 700;
}
#rotate svg {
	animation: tilt 2.4s ease-in-out infinite;
}
@keyframes tilt {
	0%, 30% { transform: rotate(0deg); }
	60%, 100% { transform: rotate(-90deg); }
}
@media (prefers-reduced-motion: reduce) {
	#rotate svg { animation: none; transform: rotate(-90deg); }
}
@media (pointer: coarse) and (orientation: portrait) {
	#rotate { display: flex; }
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	background: radial-gradient(ellipse at center, #2b2431 0%, #1d1822 70%);
	text-align: center;
	padding: 24px;
}
#status h1 {
	margin: 0;
	font-family: "Luckiest Guy", Impact, sans-serif;
	font-weight: 400;
	font-size: clamp(28px, 5vw, 48px);
	letter-spacing: 0.02em;
	color: #f7cf65;
	text-shadow: 0 4px 0 #191c18;
}
#status-bar {
	width: min(420px, 70%);
	height: 14px;
	border-radius: 999px;
	background: #20231f;
	border: 2px solid #777765;
	overflow: hidden;
}
#status-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #e0a83a, #f7cf65);
	transition: width 120ms linear;
}
#status-text {
	margin: 0;
	font-size: 16px;
	color: #cec8b2;
}
#play {
	display: none;
	cursor: pointer;
	font-family: "Luckiest Guy", Impact, sans-serif;
	font-size: 26px;
	letter-spacing: 0.04em;
	color: #191c18;
	background: #f7cf65;
	border: 3px solid #191c18;
	border-radius: 12px;
	padding: 14px 34px 10px;
	box-shadow: 0 6px 0 0 #191c18;
}
#play:hover {
	background: #eab75e;
}
#play:active {
	transform: translateY(4px);
	box-shadow: 0 2px 0 0 #191c18;
}
#play:focus-visible {
	outline: 3px solid #fff8e8;
	outline-offset: 3px;
}
#homescreen {
	display: none;
	margin: 0;
	max-width: 420px;
	font-size: 14px;
	font-weight: 600;
	color: #cec8b2;
}
#homescreen strong {
	color: #f7cf65;
}
#status.error #status-text {
	color: #ed806e;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="rotate" role="alert">
			<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
				<rect x="22" y="6" width="28" height="60" rx="6" fill="none" stroke="#f7cf65" stroke-width="4"/>
				<circle cx="36" cy="57" r="3" fill="#f7cf65"/>
			</svg>
			<p>Turn your phone sideways to play.</p>
			<a href="/#demo">Back to the site</a>
		</div>

		<div id="status">
			<a id="back" href="/#demo">&larr; Back to the site</a>
			<h1>Eggcentric</h1>
			<div id="status-bar"><div id="status-fill"></div></div>
			<p id="status-text">Loading&hellip;</p>
			<button id="play" type="button">Play</button>
			<p id="homescreen">For full screen: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>, and open Eggcentric from your home screen.</p>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	const status = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const play = document.getElementById('play');
	const touch = window.matchMedia('(pointer: coarse)').matches;

	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
	const ios = /iPhone|iPod/.test(navigator.userAgent);

	if (window.top === window && !standalone) {
		document.getElementById('back').style.display = 'block';
	}
	if (standalone) {
		document.querySelector('#rotate a').style.display = 'none';
	}
	if (ios && !standalone && window.top === window) {
		document.getElementById('homescreen').style.display = 'block';
	}

	function goFullscreen() {
		const el = document.documentElement;
		const req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (!req || document.fullscreenElement || document.webkitFullscreenElement) {
			return Promise.resolve();
		}
		return Promise.resolve(req.call(el, { navigationUI: 'hide' })).catch(function () {});
	}

	function fail(err) {
		console.error(err);
		status.classList.add('error');
		bar.style.display = 'none';
		play.style.display = 'none';
		text.textContent = err instanceof Error ? err.message : String(err || 'Something went wrong loading the demo.');
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the demo needs: ' + missing.join(', '));
		return;
	}

	let loaded = false;
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		onProgress: function (current, total) {
			if (!loaded && current > 0 && total > 0) {
				const pct = Math.min(100, Math.round((current / total) * 100));
				fill.style.width = pct + '%';
				text.textContent = 'Loading ' + pct + '% (' + (total / 1048576).toFixed(0) + ' MB)';
			}
		},
	}));

	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');

	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		loaded = true;
		bar.style.display = 'none';
		text.textContent = touch
			? 'Left thumb moves. Tap DASH to dash. Tap the pause button to pause.'
			: 'WASD or arrow keys to move. Space to dash. P to pause.';
		play.style.display = 'inline-block';
		play.focus();
	}, fail);

	play.addEventListener('click', function () {
		play.disabled = true;
		text.textContent = 'Starting\u2026';
		if (touch) {
			goFullscreen().then(function () {
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function () {});
				}
			});
		}
		engine.start({ args: ['--main-pack', pack] }).then(function () {
			status.remove();
			document.getElementById('canvas').focus();
		}, fail);
	});
}());
		</script>
	</body>
</html>
